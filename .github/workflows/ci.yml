name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  vulncheck:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Binary mode avoids govulncheck's source-mode SSA, which panics on Go 1.26 + generics.
      - run: go build -o appmeta ./cmd/appmeta
      - run: govulncheck -mode=binary ./appmeta

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzAXML, FuzzAPKSigning, FuzzResourceTable, FuzzPlist, FuzzIcon, FuzzMachO, FuzzParse]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s -fuzzminimizetime 5s .

  release:
    if: github.ref_type == 'tag'
    needs: [lint, test, vulncheck]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check the tag is vMAJOR.MINOR.PATCH
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag format: $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the CLI for macOS and Linux
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            os="${platform%-*}"
            arch="${platform#*-}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=$version" -o appmeta ./cmd/appmeta
            zip -9 "appmeta-$version-${os/darwin/macos}-$arch.zip" appmeta
            rm appmeta
          done
          ls -l appmeta-*.zip
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## \[/{f = ($0 ~ "^## \\[" version "\\]")} f' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: Version ${{ github.ref_name }}
          body_path: release-notes.md
          files: appmeta-*.zip
          fail_on_unmatched_files: true
